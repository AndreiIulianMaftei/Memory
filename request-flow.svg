<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="338px" preserveAspectRatio="none" style="width:1625px;height:338px;background:#FFFFFF;" version="1.1" viewBox="0 0 1625 338" width="1625px" zoomAndPan="magnify"><title>Memory Request Processing</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="197.9033" x="707.0371" y="24.9659">Memory Request Processing</text></g><!--entity Sample--><g class="entity" data-entity="Sample" data-source-line="19" data-uid="ent0002" id="entity_Sample"><rect fill="#E8F5E9" height="77.2038" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="138.3835" x="7" y="85.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.3835" x="17" y="110.0339">1. Sample request</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.7616" x="17" y="129.1018">addr, wdata, r/w,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.5497" x="17" y="148.1697">wide, user</text></g><!--entity Begin--><g class="entity" data-entity="Begin" data-source-line="20" data-uid="ent0003" id="entity_Begin"><rect fill="#E3F2FD" height="77.2038" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="121.0656" x="190" y="85.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.0656" x="200" y="110.0339">2. Start request</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.5778" x="200" y="129.1018">ready = 0</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.0078" x="200" y="148.1697">error = 0</text></g><!--entity Valid--><g class="entity" data-entity="Valid" data-source-line="21" data-uid="ent0004" id="entity_Valid"><rect fill="#FFF8E1" height="77.2038" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="161.3855" x="356" y="85.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.8796" x="366" y="110.0339">Valid operation,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.3535" x="366" y="129.1018">address range and</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.3855" x="366" y="148.1697">ROM/RAM boundary?</text></g><!--entity Region--><g class="entity" data-entity="Region" data-source-line="22" data-uid="ent0005" id="entity_Region"><rect fill="#FFF8E1" height="58.1358" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="74.3198" x="562" y="131.5679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.2558" x="572" y="156.5339">Address</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.3198" x="572" y="175.6018">in ROM?</text></g><!--entity Permission--><g class="entity" data-entity="Permission" data-source-line="24" data-uid="ent0006" id="entity_Permission"><rect fill="#FFF8E1" height="58.1358" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="157.6195" x="681" y="219.5679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.1695" x="691" y="244.5339">Permission for every</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.6195" x="691" y="263.6018">accessed byte/block?</text></g><!--entity Ownership--><g class="entity" data-entity="Ownership" data-source-line="25" data-uid="ent0007" id="entity_Ownership"><rect fill="#E3F2FD" height="77.2038" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="141.2815" x="900" y="244.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.2815" x="910" y="269.0339">Update ownership</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.7336" x="910" y="288.1018">user 255: release</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.5556" x="910" y="307.1697">write: assign user</text></g><!--entity Width--><g class="entity" data-entity="Width" data-source-line="26" data-uid="ent0008" id="entity_Width"><rect fill="#E3F2FD" height="96.2717" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="140.0215" x="1102" y="236.5679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114.2116" x="1112" y="261.5339">Width adaptation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.9256" x="1112" y="280.6018">4-byte: forward</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.5116" x="1112" y="299.6697">1-byte read: LSB</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.0215" x="1112" y="318.7376">1-byte write: RMW</text></g><!--entity MainMemory--><g class="entity" data-entity="MainMemory" data-source-line="27" data-uid="ent0009" id="entity_MainMemory"><rect fill="#ECEFF1" height="77.2038" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="106.2677" x="1305.5" y="250.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.2677" x="1315.5" y="275.0339">Drive mem_*</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.9877" x="1315.5" y="294.1018">and wait for</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.5737" x="1315.5" y="313.1697">mem_ready</text></g><!--entity RomWrite--><g class="entity" data-entity="RomWrite" data-source-line="29" data-uid="ent0010" id="entity_RomWrite"><rect fill="#FFF8E1" height="58.1358" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="59.4238" x="730.5" y="131.5679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="32.3399" x="740.5" y="156.5339">ROM</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.4238" x="740.5" y="175.6018">write?</text></g><!--entity RomLatency--><g class="entity" data-entity="RomLatency" data-source-line="30" data-uid="ent0011" id="entity_RomLatency"><rect fill="#EDE7F6" height="58.1358" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="172.8094" x="884" y="154.5679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.8094" x="894" y="179.5339">Wait latencyRom cycles</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.1315" x="894" y="198.6018">0 = same clock edge</text></g><!--entity RomRead--><g class="entity" data-entity="RomRead" data-source-line="31" data-uid="ent0012" id="entity_RomRead"><rect fill="#EDE7F6" height="77.2038" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="142.8915" x="1287" y="143.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.3016" x="1297" y="168.0339">Read 1 or 4 bytes</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.8915" x="1297" y="187.1018">from internal ROM</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.0237" x="1297" y="206.1697">(little-endian)</text></g><!--entity Success--><g class="entity" data-entity="Success" data-source-line="33" data-uid="ent0013" id="entity_Success"><rect fill="#E8F5E9" height="77.2038" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="144.9775" x="1475" y="197.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.0858" x="1485" y="222.0339">Success</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.9775" x="1485" y="241.1018">ready = 1, error = 0</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.3497" x="1485" y="260.1697">rdata for reads</text></g><!--entity Error--><g class="entity" data-entity="Error" data-source-line="34" data-uid="ent0014" id="entity_Error"><rect fill="#FFEBEE" height="77.2038" rx="5" ry="5" style="stroke:#455A64;stroke-width:0.5;" width="144.9775" x="898" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81.0457" x="908" y="72.0339">Access error</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.9775" x="908" y="91.1018">ready = 1, error = 1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.4715" x="908" y="110.1697">no memory access</text></g><!--link Sample to Begin--><g class="link" data-entity-1="Sample" data-entity-2="Begin" data-source-line="36" data-uid="lnk15" id="link_Sample_Begin"><path d="M145.22,123.5679 C159.97,123.5679 169.43,123.5679 183.83,123.5679" fill="none" id="Sample-to-Begin" style="stroke:#455A64;stroke-width:1.5;"/><polygon fill="#455A64" points="189.83,123.5679,180.83,119.5679,184.83,123.5679,180.83,127.5679,189.83,123.5679" style="stroke:#455A64;stroke-width:1.5;"/></g><!--link Begin to Valid--><g class="link" data-entity-1="Begin" data-entity-2="Valid" data-source-line="37" data-uid="lnk16" id="link_Begin_Valid"><path d="M311.15,123.5679 C325.46,123.5679 334.94,123.5679 349.97,123.5679" fill="none" id="Begin-to-Valid" style="stroke:#455A64;stroke-width:1.5;"/><polygon fill="#455A64" points="355.97,123.5679,346.97,119.5679,350.97,123.5679,346.97,127.5679,355.97,123.5679" style="stroke:#455A64;stroke-width:1.5;"/></g><!--link Valid to Region--><g class="link" data-entity-1="Valid" data-entity-2="Region" data-source-line="38" data-uid="lnk17" id="link_Valid_Region"><path d="M517.27,146.8179 C532.89,146.8179 542.52,146.8179 555.88,146.8179" fill="none" id="Valid-to-Region" style="stroke:#455A64;stroke-width:1.5;"/><polygon fill="#455A64" points="561.88,146.8179,552.88,142.8179,556.88,146.8179,552.88,150.8179,561.88,146.8179" style="stroke:#455A64;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="21.7419" x="517.57" y="162.7839">yes</text></g><!--link Region to Permission--><g class="link" data-entity-1="Region" data-entity-2="Permission" data-source-line="39" data-uid="lnk18" id="link_Region_Permission"><path d="M636.12,170.2379 C667.03,170.2379 706,170.2379 706,170.2379 C706,170.2379 706,191.1279 706,213.3979" fill="none" id="Region-to-Permission" style="stroke:#455A64;stroke-width:1.5;"/><polygon fill="#455A64" points="706,219.3979,710,210.3979,706,214.3979,702,210.3979,706,219.3979" style="stroke:#455A64;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30.3519" x="664.64" y="186.2039">RAM</text></g><!--link Permission to Ownership--><g class="link" data-entity-1="Permission" data-entity-2="Ownership" data-source-line="40" data-uid="lnk19" id="link_Permission_Ownership"><path d="M839.28,260.8179 C859.21,260.8179 874.46,260.8179 893.93,260.8179" fill="none" id="Permission-to-Ownership" style="stroke:#455A64;stroke-width:1.5;"/><polygon fill="#455A64" points="899.93,260.8179,890.93,256.8179,894.93,260.8179,890.93,264.8179,899.93,260.8179" style="stroke:#455A64;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" length